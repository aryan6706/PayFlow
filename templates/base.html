<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}PayFlow{% endblock %}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>{% if session.user_id %}<header class="topbar no-print"><a class="brand" href="{{ url_for('dashboard') }}"><span>PF</span>PayFlow</a><button class="menu-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#sideNav">Menu</button></header><aside class="sidebar collapse d-lg-block" id="sideNav"><nav><a href="{{ url_for('dashboard') }}">Overview</a><a href="{{ url_for('employees') }}">Employees</a><a href="{{ url_for('payrolls') }}">Payroll ledger</a><a href="{{ url_for('reports') }}">Reports</a></nav><div class="sidebar-footer"><span>{{ session.username }}</span><a href="{{ url_for('logout') }}">Sign out</a></div></aside>{% endif %}<main class="{% if session.user_id %}workspace{% else %}login-page{% endif %}">{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
