{% extends 'base.html' %}{% block title %}New payroll · PayFlow{% endblock %}{% block content %}<div class="page-title"><div><p class="eyebrow">PAYROLL</p><h1>New payroll record</h1><p>Net salary is calculated automatically on submission.</p></div><a class="btn btn-light" href="{{ url_for('payrolls') }}">Cancel</a></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>Employee<select name="employee_id" required>{% for e in employees %}<option value="{{ e.id }}" data-base="{{ e.base_salary }}">{{ e.full_name }} · {{ e.employee_code }}</option>{% endfor %}</select></label><label>Pay period<input type="month" name="pay_period" value="{{ current_period }}" required></label><label>Base salary<input id="base" readonly value="{{ employees[0].base_salary|money }}"></label><label>Allowances<input class="calc" type="number" min="0" step="0.01" name="allowances" value="0"></label><label>Deductions<input class="calc" type="number" min="0" step="0.01" name="deductions" value="0"></label><label>Tax<input class="calc" type="number" min="0" step="0.01" name="tax" value="0"></label></div><div class="net-preview">Estimated net salary <strong id="net-preview"></strong></div><div class="form-actions"><button class="btn btn-dark">Create payroll record</button></div></form></section><script>const select=document.querySelector('[name="employee_id"]'),base=document.querySelector('#base'),net=document.querySelector('#net-preview'),v=n=>Number(document.querySelector(`[name="${n}"]`).value)||0;function update(){let b=Number(select.selectedOptions[0].dataset.base);base.value='₹'+b.toLocaleString('en-IN',{minimumFractionDigits:2});net.textContent='₹'+(b+v('allowances')-v('deductions')-v('tax')).toLocaleString('en-IN',{minimumFractionDigits:2});}select.onchange=update;document.querySelectorAll('.calc').forEach(e=>e.oninput=update);update();</script>{% endblock %}
